<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <defs>
    <clipPath id="top-half">
      <rect x="0" y="0" width="120" height="50"/>
    </clipPath>
    <clipPath id="bot-half">
      <rect x="0" y="50" width="120" height="50"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="120" height="100" rx="14" fill="#0d0d0d"/>

  <!-- B in white — base layer -->
  <text x="7" y="79" font-family="Arial Black, sans-serif" font-weight="900" font-size="74" fill="#ffffff">B</text>

  <!-- H in green — sits on top of B (H over B in bottom half of overlap) -->
  <text x="47" y="79" font-family="Arial Black, sans-serif" font-weight="900" font-size="74" fill="#00e676">H</text>

  <!-- B in white clipped to top half — B goes over H in top half of overlap -->
  <text x="7" y="79" font-family="Arial Black, sans-serif" font-weight="900" font-size="74" fill="#ffffff" clip-path="url(#top-half)">B</text>

  <!-- H in green clipped to bottom half — reinforces H over B in bottom half -->
  <text x="47" y="79" font-family="Arial Black, sans-serif" font-weight="900" font-size="74" fill="#00e676" clip-path="url(#bot-half)">H</text>
</svg>
